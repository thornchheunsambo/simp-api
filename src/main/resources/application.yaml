server:
  port: ${PORT:8080}

spring:
  application:
    name: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/simp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update      # schema is owned by Flyway; use 'none' if validation complains
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt-secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-32+chars}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:*}
  student-email-domain: ${STUDENT_EMAIL_DOMAIN:}     # e.g. acleda.edu.kh ; blank = no restriction
  admin-email: ${ADMIN_EMAIL:admin@simp.local}
  admin-password: ${ADMIN_PASSWORD:Admin@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html